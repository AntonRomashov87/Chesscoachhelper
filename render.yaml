services:
  - type: web
    name: chess-trainer-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python chess_trainer_bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: TRAINER_ID
        sync: false
      - key: MONGODB_URI
        sync: false
    env:
      - key: PYTHON_VERSION
        value: 3.11.9
